name: Deploy Admin

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/admin/**"
      - "packages/site-schema/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/deploy-app.yml"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: "admin-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: admin
      webhook_secret: COOLIFY_WEBHOOK_ADMIN
    secrets: inherit
