name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/db/**"
      - "packages/site-schema/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/deploy-app.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: "backend-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: backend
      webhook_secret: COOLIFY_WEBHOOK_BACKEND
    secrets: inherit
